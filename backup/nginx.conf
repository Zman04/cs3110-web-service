server {

        root /var/www/zaustin3-subdomain.ignorelist.com/html;
        index index.html index.htm;

	server_name zaustin3-subdomain.ignorelist.com;
	location /hw7-api/ {
		proxy_pass http://127.0.0.1:3001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}

	location /semester-project/api/ {
    		proxy_pass http://127.0.0.1:3002/api/;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
}



	location ^~ /semester-project {
		alias /var/www/zaustin3-subdomain.ignorelist.com/html/semester-project/;
		index index.html;
		try_files $uri $uri/ = 404;
	}
	location /hw7/ {
		try_files $uri $uri/ =404;
	}
	
	location /ws/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
	location /hw8/ {
		try_files $uri $uri/ =404;
	}
	location / {
    		proxy_pass http://127.0.0.1:3000;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
}
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zaustin3-subdomain.ignorelist.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zaustin3-subdomain.ignorelist.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = zaustin3-subdomain.ignorelist.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen 80;
        listen [::]:80;

	server_name zaustin3-subdomain.ignorelist.com;
    return 404; # managed by Certbot


}
