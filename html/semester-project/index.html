<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Title</title>
        <link rel="stylesheet" href="style.css">
        </head>

    <body>

	<div id="main-menu-screen">
            <header>
                <h1>Interactive Flashcards</h1>
            </header>
            <main style="flex-direction: column; gap: 20px;">
                <button id="create-deck-btn">+ Create New Card Deck</button>
                <button id="start-btn">Open Spatial Directions Deck</button>
            </main>
        </div>

	<div id="flashcard-screen" style="display: none;">

		<button id="back-btn" style= "margin: 10px;"> Back to Menu</button>

        <header>
            <div class="score-area">
                <div class="score-incorrect" id="score-incorrect"></div>
                <div class="score-correct" id="score-correct"></div>
            </div>
        </header>
        <main>
            <div class="flashcard-area">
                <div class="card-incorrect" id="card-incorrect">
                    <div class="card-correct" id="card-correct"></div>
                </div>
            </div>
        </main>
       </div>  <script src="script.js"></script>
    </body>
</html>
