<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive flashcard application.">
    <title>Interactive Flashcards</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

    <div id="login-screen">
        <header>
            <h1>Login</h1>
        </header>
        <main>
            <div class="menu-container">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" placeholder="Enter username" />
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="Enter password" />
                <button class="menu-btn" id="login-btn">Login</button>
                <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">
                </p>
            </div>
        </main>
    </div>

    <div id="main-menu-screen" style="display: none;">
        <header>
            <h1>Interactive Flashcards</h1>
        </header>

        <main id="main-menu-content">
            <div id="deck-container">
                <div id="deck-list">
                    <!-- Decks will be populated dynamically -->
                    <button class="deck-btn" id="start-btn">Spatial Directions</button>
                    <button class="deck-btn" id="deck2-btn">Deck 2</button>
                </div>
                <button id="create-deck-btn">+ Create New Card Deck</button>
                <button class="menu-btn secondary-btn" id="logout-btn">Logout</button>
            </div>
        </main>
    </div>
    <div id="deck-details-screen" style="display: none;">
        <header>
            <h1 id="deck-details-title">Deck Title</h1>
        </header>

        <main id="deck-details-content">
            <div class="menu-container">
                <button class="menu-btn" id="study-deck-btn">Study</button>
                <button class="menu-btn" id="edit-deck-btn">Edit</button>
                <button class="menu-btn secondary-btn" id="details-back-btn">Back to Menu</button>
            </div>
        </main>
    </div>

    <div id="edit-deck-screen" style="display: none;">
        <header>
            <h1 id="edit-deck-title">Edit Deck</h1>
        </header>
        <main id="edit-deck-content">
            <div class="menu-container">
                <div id="card-list-container">
                    <!-- Cards will be populated here -->
                </div>
                <button class="menu-btn" id="add-card-btn">+ Add Card</button>
                <button class="menu-btn secondary-btn" id="edit-back-btn">Back</button>
            </div>
        </main>
    </div>

    <div id="add-card-modal" class="modal" style="display: none;">
        <div class="modal-content add-card-modal-content">

            <!-- Modal Header -->
            <div class="modal-header">
                <h2>Add Card</h2>
                <span class="close-btn" id="close-modal-btn">&times;</span>
            </div>

            <!-- Two-column body -->
            <div class="add-card-body">

                <!-- Left Column -->
                <div class="add-card-left">

                    <label for="card-prompt-input">Prompt</label>
                    <input type="text" id="card-prompt-input" placeholder="Enter a question or title..." />

                    <!-- Image Dropzone -->
                    <div id="image-dropzone">
                        <input type="file" id="image-file-input" accept="image/*" />
                        <div id="dropzone-placeholder">
                            <span class="dropzone-icon">&#128247;</span>
                            <p>Insert Image</p>
                            <p class="dropzone-hint">Click or drag &amp; drop</p>
                        </div>
                        <img id="dropzone-preview" src="" alt="Image preview" />
                    </div>

                </div>

                <!-- Vertical divider -->
                <div class="add-card-divider"></div>

                <!-- Right Column: Correct-Area Selector -->
                <div class="add-card-right">
                    <p class="right-col-label">Correct Area</p>

                    <div id="correct-area-container">
                        <img id="correct-area-bg" src="" alt="" draggable="false" />
                        <div id="correct-area-selector"></div>

                        <!-- Placeholder shown when no image is uploaded yet -->
                        <div id="correct-area-placeholder">
                            <p>Upload an image on the left to define the correct area.</p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button class="menu-btn" id="save-card-btn">Save Card</button>
            </div>

        </div>
    </div>

    <div id="flashcard-screen" style="display: none;">

        <button id="back-btn" style="margin: 10px;"> Back to Menu</button>

        <header>
            <div class="score-area">
                <div class="score-incorrect" id="score-incorrect"></div>
                <div class="score-correct" id="score-correct"></div>
            </div>
        </header>
        <main>
            <div class="flashcard-area">
                <h2 id="flashcard-question" style="text-align: center; margin-bottom: 20px;">Question goes here</h2>
                <div class="card-incorrect" id="card-incorrect">
                    <!-- Image will be loaded dynamically -->
                    <img id="flashcard-image" src="" alt="Flashcard scenario" draggable="false">

                    <!-- The correct area (green box) positioned absolutely over the image -->
                    <div class="card-correct" id="card-correct" style="position: absolute;"></div>
                </div>
                <div id="flashcard-explanation" style="margin-top: 20px; text-align: center; color: #555;"></div>
            </div>
        </main>
    </div>
    <script src="script.js?v=4"></script>
</body>

</html>
