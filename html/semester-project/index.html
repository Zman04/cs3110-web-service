<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive flashcard application.">
    <title>Interactive Flashcards</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

    <div id="main-menu-screen">
        <header>
            <h1>Interactive Flashcards</h1>
        </header>

        <main id="main-menu-content">
            <div id="deck-container">
                <div id="deck-list">
                    <!-- Decks will be populated dynamically -->
                    <button class="deck-btn" id="start-btn">Spatial Directions</button>
                    <button class="deck-btn" id="deck2-btn">Deck 2</button>
                </div>
                <button id="create-deck-btn">+ Create New Card Deck</button>
            </div>
        </main>
    </div>

    <div id="flashcard-screen" style="display: none;">

        <button id="back-btn" style="margin: 10px;"> Back to Menu</button>

        <header>
            <div class="score-area">
                <div class="score-incorrect" id="score-incorrect"></div>
                <div class="score-correct" id="score-correct"></div>
            </div>
        </header>
        <main>
            <div class="flashcard-area">
                <h2 id="flashcard-question" style="text-align: center; margin-bottom: 20px;">Question goes here</h2>
                <div class="card-incorrect" id="card-incorrect">
                    <!-- Image will be loaded dynamically -->
                    <img id="flashcard-image" src="" alt="Flashcard scenario" draggable="false">

                    <!-- The correct area (green box) positioned absolutely over the image -->
                    <div class="card-correct" id="card-correct" style="position: absolute;"></div>
                </div>
                <div id="flashcard-explanation" style="margin-top: 20px; text-align: center; color: #555;"></div>
            </div>
        </main>
    </div>
    <script src="script.js?v=2"></script>
</body>

</html>
