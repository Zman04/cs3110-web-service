<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure CRUD API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Secure Database Persistence</h2>

    <div id="authSection">
        <h3>Login / Register</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleAuth('/api/register')">Register</button>
        <button onclick="handleAuth('/api/login')">Login</button>
    </div>

    <div id="appSection" style="display: none;">
        <button onclick="logout()">Logout</button>
        <hr>
        <div>
            <input type="text" id="newItemInput" placeholder="Add a new fruit...">
            <button id="addBtn">Add Item (POST)</button>
        </div>
        <hr>
        <h3>Current Items:</h3>
        <ul id="itemsContainer"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
